name: mc_neo_builder

services:
  # Development Container
  workspace:
    build:
      context: ./workspace
      dockerfile: Dockerfile
    image: mc-neo-builder-workspace:latest
    container_name: mc_neo_builder_workspace
    stdin_open: true
    tty: true
    volumes:
      - ./workspace/app:/app:cached
      - nv_dist:/app/dist
    command: sleep infinity
    networks:
      - n-mc_neo_builder

  # Test Minecraft Server
  testserver:
    build:
      context: ./testserver
      dockerfile: Dockerfile
    image: mc-neo-builder-testserver:latest
    container_name: mc_neo_builder_testserver
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      ONLINE_MODE: "FALSE"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "devpassword"
      RESOURCE_PACK: "http://localserver:8000/NeoBuilderResourcePack.zip"
      RESOURCE_PACK_SHA1: "f8b30c27c261cfd6366e563046ea8f1f8ae06fbe"
      RESOURCE_PACK_ENFORCE: "true"
      JVM_XX_OPTS: "-agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005"
    ports:
      - "25565:25565"
      - "5005:5005"
      - "25575:25575"
    stdin_open: true
    tty: true
    volumes:
      - nv_server_data:/data
      - nv_dist:/dist:ro
    networks:
      - n-mc_neo_builder

  # Resource Pack HTTP Server (nv_dist の内容を配信)
  packserver:
    image: mc-neo-builder-workspace:latest
    container_name: mc_neo_builder_packserver
    hostname: packserver
    command: /opt/java/openjdk/bin/jwebserver -d /app/dist -b 0.0.0.0 -p 8000
    ports:
      - "8000:8000"
    volumes:
      - nv_dist:/app/dist:ro
    networks:
      - n-mc_neo_builder
    depends_on:
      - workspace

  # Virtual Desktop (KasmVNC/Selkies — ブラウザから http://<host>:3000 で操作)
  desktop:
    image: lscr.io/linuxserver/webtop:ubuntu-xfce
    container_name: mc_neo_builder_desktop
    shm_size: "1gb"
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: "Asia/Tokyo"
      PASSWORD: "devpassword"
      TITLE: "NeoBuilder Desktop"
    ports:
      - "3000:3000"
      - "3001:3001"
    volumes:
      - nv_desktop:/config
    networks:
      - n-mc_neo_builder
    restart: unless-stopped

  # Operation Agent
  operationer:
    build:
      context: ./operationer
      dockerfile: Dockerfile
    image: mc-neo-builder-operationer:latest
    container_name: mc_neo_builder_operationer
    shm_size: "2gb"
    env_file:
      - .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/operationer
    command: sleep infinity
    networks:
      - n-mc_neo_builder

volumes:
  nv_server_data:
  nv_dist:
  nv_desktop:

networks:
  n-mc_neo_builder:
    driver: bridge
